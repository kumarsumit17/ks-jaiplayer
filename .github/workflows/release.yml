name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.ver.outputs.name }}
      code: ${{ steps.ver.outputs.code }}
    steps:
      - id: ver
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          IFS='.' read -r MAJ MIN PAT <<< "${TAG%%-*}"
          echo "name=$TAG" >> "$GITHUB_OUTPUT"
          echo "code=$((MAJ * 10000 + MIN * 100 + PAT))" >> "$GITHUB_OUTPUT"

  android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build signed Android / Google TV release
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >
          ./gradlew :androidApp:assembleRelease :androidApp:bundleRelease
          -PversionName=${{ needs.version.outputs.name }}
          -PversionCode=${{ needs.version.outputs.code }}
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            **/build/outputs/apk/release/*.apk
            **/build/outputs/bundle/release/*.aab
      - if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

  desktop:
    needs: version
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Package native installer
        shell: bash
        run: >
          ./gradlew :desktopApp:packageReleaseDistributionForCurrentOS
          -PversionName=${{ needs.version.outputs.name }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: "**/build/compose/binaries/**/*.@(msi|exe|dmg|pkg)"

  release:
    needs: [android, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/**/*
