name: Release

# The release workflow is shared by every KS-Suite Kotlin app and lives in ks-utility
# (specs/release-workflow.md there). This file only names KS JaiPlayer's platforms.
#
#   Tag push vMAJOR.MINOR.PATCH   Builds the signed APK (phone + Google TV), the macOS dmg and the
#                                 Windows msi, then publishes the GitHub Release.
#   Manual run                    Builds everything for testing; never publishes.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: kumarsumit17/ks-utility/.github/workflows/kotlin-app-release.yml@feat/shared-release-workflow
    permissions:
      contents: write
    with:
      app-name: ks-jaiplayer
      display-name: KS JaiPlayer
      android-module: ":mobile:android"
      mac-module: ":desktop:mac"
      windows-module: ":desktop:windows"
      test-tasks: ":shared:desktopTest :shared:check"
      desktop-test-tasks: ":shared:desktopTest"
    secrets: inherit
