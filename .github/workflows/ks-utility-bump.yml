name: Move to the newest ks-utility

# ks-utility's notify-apps.yml sends "ks-utility-released" when it tags a release; the daily run
# catches a missed notice. The shared workflow moves the pin on dev, runs the tests and pushes
# only when they pass (KS-Suite specs/release-cycle.md, step 1; ks-utility specs/release-workflow.md).

on:
  repository_dispatch:
    types: [ks-utility-released]
  schedule:
    - cron: "17 4 * * *"   # daily, in case a notice was missed
  workflow_dispatch:

permissions: {}

jobs:
  bump:
    permissions: { contents: write, issues: write }
    uses: kumasumit/ks-utility/.github/workflows/ks-utility-bump.yml@v0.16.0
    with:
      kind: kotlin
      java: true
      test: ./gradlew :shared:desktopTest :shared:check
    # With the owner's KS_WORKFLOWS_TOKEN the move also updates the @vX.Y.Z of ks-utility's shared
    # workflows here; without it they stay, and ks-suite-check stops the release until moved by hand.
    secrets:
      KS_WORKFLOWS_TOKEN: ${{ secrets.KS_WORKFLOWS_TOKEN }}
