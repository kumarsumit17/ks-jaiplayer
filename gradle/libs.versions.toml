[versions]
# Kotlin is kept in step with ks-utility/kotlin/gradle/libs.versions.toml.
kotlin = "2.4.21"
composeMultiplatform = "1.12.2"
composeMaterial3 = "1.9.0"
agp = "9.5.2"
coroutines = "1.11.0"
jna = "5.19.1"
media3 = "1.11.1"
activity = "1.13.0"

# Android SDK levels.
androidCompileSdk = "37"
androidMinSdk = "26"
androidTargetSdk = "37"

[libraries]
# Compose Multiplatform (commonMain).
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "composeMaterial3" }
compose-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "composeMultiplatform" }

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

# Desktop: calls libVLC (LGPL-2.1+) from Kotlin. JNA is used under Apache-2.0.
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }

# Android and Google TV playback (Apache-2.0).
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-ui-compose = { module = "androidx.media3:media3-ui-compose", version.ref = "media3" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }

# First-party: the ks-utility submodule, included with includeBuild in settings.gradle.kts (no version).
ks-utility = { module = "com.ks:utility" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
